name: Ex Libris CI

on:
  push:
    branches: [ main, feature/* ]  # Run on pushes to main and any feature branch
  pull_request:
    branches: [ main ]  # Run on pull requests to main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable
          echo "::add-path::$(pwd)/flutter/bin"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # The build APK step is commented out for now.
      # - name: Build APK (optional)
      #   run: flutter build apk --release  # Generate release APK
