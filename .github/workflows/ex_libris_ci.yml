name: Ex Libris CI  # Name of the GitHub Actions workflow

on:
  push:
    branches: [ main, feature/* ]  # Triggers the workflow on pushes to main and any feature branch
  pull_request:
    branches: [ main ]  # Triggers the workflow on pull requests to the main branch

jobs:
  build:  # This defines the build job

    runs-on: ubuntu-latest  # Runs the job on the latest version of Ubuntu

    steps:
      # Step to check out the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step to set up JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'  # Define the Java version to use
          distribution: 'temurin'  # Specify the distribution of Java

      # Step to install Flutter
      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable
          # Set the Flutter path for the current session
          echo "$PWD/flutter/bin" >> $GITHUB_PATH
          flutter pub get  # Get the Flutter dependencies immediately after the path is set

      # Step to ensure Flutter is usable
      - name: Run Flutter Doctor
        run: flutter doctor  # Verify that Flutter is set up correctly

      # Step to get dependencies
      - name: Get dependencies
        run: flutter pub get  # Runs the command to get Flutter dependencies defined in pubspec.yaml

      # Step to analyze the Dart code for potential issues
      - name: Analyze code
        run: flutter analyze  # Runs Flutter analysis on the code base

      # Step to execute tests in the Flutter application
      - name: Run tests
        run: flutter test  # Runs the test suite

      # Optional step to build the APK for the Flutter app
      # Uncomment to build APK later
      # - name: Build APK (optional)
      #   run: flutter build apk --release  # Generates an APK file in release mode
