name: Ex Libris CI

on:
  push:
    # Triggers the workflow on pushes to main and any feature branch
    branches: [ main, feature/* ]

  pull_request:
    # Triggers the workflow on pull requests to the main branch
    branches: [ main ]

jobs:
  build:  # This defines the build job

    # Runs the job on the latest version of Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Step to check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step to set up Java Development Kit version 11
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'  # Define the Java version to use
          distribution: 'temurin'  # Specify the distribution of Java

      # Step to install Flutter
      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable
          echo "::add-path::$(pwd)/flutter/bin"  # Add Flutter to the PATH
          flutter channel stable  # Ensure we are on the stable channel
          flutter upgrade  # Upgrade to the latest stable version

      # Step to fetch application dependencies
      - name: Get dependencies
        # Runs the command to get Flutter dependencies defined in pubspec.yaml
        run: flutter pub get

      # Step to analyze the Dart code for potential issues
      - name: Analyze code
        # Runs Flutter analysis on the code base
        run: flutter analyze

      # Step to execute tests in the Flutter application
      - name: Run tests
        run: flutter test  # Runs the test suite

      # Optional step to build the APK for the Flutter app
      # Uncomment to build APK later
      # - name: Build APK (optional)
      #   run: flutter build apk --release  # Generates an APK file in release mode
