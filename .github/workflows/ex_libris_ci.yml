name: Ex Libris CI  # Name of the GitHub Actions workflow

on:
  push:
    branches: [ main, feature/* ]  # Triggers on pushes to main and any feature branches
  pull_request:
    branches: [ main ]  # Triggers on pull requests to the main branch

jobs:
  build:  # Defines the build job

    runs-on: ubuntu-latest  # Runs the job on the latest version of Ubuntu

    steps:
      # Step to check out the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step to set up JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'  # Define the Java version to use
          distribution: 'temurin'  # Specify the distribution of Java

      # Step to install Flutter
      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable
          echo "$PWD/flutter/bin" >> $GITHUB_PATH  # Use the new way of setting PATH
          flutter pub get  # Run to get Flutter dependencies

      # Step to ensure Flutter is usable
      - name: Flutter Doctor
        run: flutter doctor  # This helps to verify Flutter installation and environment

      # Step to get dependencies
      - name: Get dependencies
        run: flutter pub get  # Fetch Flutter dependencies defined in pubspec.yaml

      # Step to analyze the Dart code for potential issues
      - name: Analyze code
        run: flutter analyze  # Run Flutter analysis on the code base

      # Step to execute tests in the Flutter application
      - name: Run tests
        run: flutter test  # Run the test suite

      # Optional step to build the APK for the Flutter app
      # Uncomment to build the APK later
      # - name: Build APK (optional)
      #   run: flutter build apk --release  # Generates an APK file in release mode
