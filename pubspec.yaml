name: ex_libris
description: "A personal library management flutter app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Drift for local database
  drift: ^2.19.0
  drift_sqflite: ^2.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.6.0

  # Freezed annotation for immutable objects
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  # Drift code generator
  drift_dev: ^2.19.0

  flutter_test:
    sdk: flutter

  # Build Runner for code generation
  build_runner: ^2.4.11

  # Freezed for generating immutable data classes
  freezed: ^3.2.1

  # JSON serializable for serialization
  json_serializable: ^6.8.0

  # The "flutter_lints" contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^6.0.0

flutter:
  # The following line ensures that the Material Icons font is
  uses-material-design: true
